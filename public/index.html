<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사업 분석자동화</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --ink:#1b2030; --muted:#5b6472; --line:#e6e8ee; --accent:#3f5bd9;
         --left:280px; --right:340px; --top:52px; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;line-height:1.55}
  .topbar{height:var(--top);display:flex;align-items:center;gap:14px;padding:0 16px;
          background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:1000}
  .topbar h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
  .topbar .coverage{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
  #addr-search{flex:1;max-width:380px;display:flex;gap:6px}
  #addr-search input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font:inherit}
  #addr-search button{padding:7px 14px;border:0;border-radius:7px;background:var(--accent);color:#fff;
                      font:inherit;font-weight:600;cursor:pointer}
  .shell{display:flex;height:calc(100% - var(--top));min-height:0}
  #panel-left{width:var(--left);flex:none;background:var(--card);border-right:1px solid var(--line);
              overflow-y:auto;padding:14px}
  #map-wrap{flex:1;position:relative;min-width:0}
  #map{position:absolute;inset:0;background:#e9ebef}
  #panel-right{width:var(--right);flex:none;background:var(--card);border-left:1px solid var(--line);
               overflow-y:auto;display:flex;flex-direction:column}
  #panel-right[hidden]{display:none}
  .sect{font-size:11px;color:var(--muted);margin:14px 0 7px;letter-spacing:.02em}
  .sect:first-child{margin-top:0}
  label{display:block;font-size:13px;color:var(--muted);margin:9px 0 4px}
  input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;background:#fff}
  .row{display:flex;gap:8px}
  .row>div{flex:1}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);margin:5px 0}
  .chk input{width:auto;margin:0}
  #judge-form button{margin-top:14px;width:100%;padding:10px;border:0;border-radius:7px;
                     background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  #judge-form button:disabled{opacity:.5;cursor:default}
  #form-msg{margin-top:9px;font-size:12.5px;color:var(--muted);white-space:pre-wrap;min-height:18px}
  #legend{position:absolute;left:10px;bottom:10px;z-index:500;background:rgba(255,255,255,.94);
          border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px;max-width:190px}
  #legend b{display:block;margin-bottom:5px;font-size:11px;color:var(--muted);font-weight:600}
  #legend .item{display:flex;align-items:center;gap:6px;margin:2px 0}
  #legend .sw{width:11px;height:11px;border-radius:2px;flex:none}
  #map-notice{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:500;
              background:rgba(27,32,48,.88);color:#fff;border-radius:7px;padding:7px 13px;font-size:12.5px;
              max-width:80%;text-align:center}
  #map-notice[hidden]{display:none}
  #tab-bar{display:flex;border-bottom:1px solid var(--line);flex:none}
  #tab-bar button{flex:1;padding:10px 4px;border:0;background:none;font:inherit;font-size:12.5px;
                  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  #tab-bar button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
  .tabpane{padding:13px;display:none}
  .tabpane.on{display:block}
  #result-head{padding:13px 13px 0;font-size:12.5px;color:var(--muted)}
  #result-head .zone{display:block;font-size:15px;color:var(--ink);font-weight:700;margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{border-bottom:1px solid var(--line);text-align:left;padding:7px 5px;vertical-align:top}
  th{color:var(--muted);font-weight:600}
  dl{margin:0;font-size:12.5px}
  dl div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
  dt{color:var(--muted)}
  dd{margin:0;text-align:right}
  .status-저촉{color:#c0392b;font-weight:700}
  .status-비저촉{color:#1e8449;font-weight:700}
  .status-조건부,.status-판정불가{color:#b9770e;font-weight:700}
  .note{background:#fef4ec;border:1px solid #e2a06a;border-radius:8px;padding:11px 13px;font-size:13px}
  .foot{margin-top:8px;font-size:11.5px;color:var(--muted)}
  .lawitem{border-bottom:1px solid var(--line);padding:9px 0}
  .lawitem h4{margin:0 0 4px;font-size:13px}
  .lawitem pre{margin:0;white-space:pre-wrap;font:inherit;font-size:12px;color:var(--muted)}
  a{color:var(--accent)}
  .leaflet-container{font-family:inherit}
  @media (max-width:768px){
    .shell{flex-direction:column;height:auto}
    #panel-left,#panel-right{width:auto;border:0;border-top:1px solid var(--line)}
    #map-wrap{height:56vh;flex:none;order:-1}
    .topbar{flex-wrap:wrap;height:auto;padding:8px 12px;gap:8px}
    .topbar .coverage{display:none}
    #addr-search{max-width:none;width:100%}
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>사업 분석자동화</h1>
  <form id="addr-search">
    <input id="address" placeholder="주소 검색 (예: 목포시 옥암동 1)" autocomplete="off">
    <button type="submit">검색</button>
  </form>
  <span class="coverage">전남 22개 시군</span>
</div>

<div class="shell">

  <aside id="panel-left">
    <form id="judge-form">
      <p class="sect">사업 조건</p>
      <div class="row">
        <div>
          <label for="project_type">사업 종류</label>
          <select id="project_type">
            <option value="태양광">태양광</option>
            <option value="육상풍력">육상풍력</option>
            <option value="해상풍력">해상풍력</option>
          </select>
        </div>
        <div>
          <label for="capacity_kw">용량(kW)</label>
          <input id="capacity_kw" type="number" min="0" step="0.1" placeholder="990">
        </div>
      </div>

      <p class="sect">이격거리 적용 배제 (법 제27조의3제3항)</p>
      <label class="chk"><input type="checkbox" class="exemption" value="주민참여형"> 주민참여형</label>
      <label class="chk"><input type="checkbox" class="exemption" value="지붕형"> 지붕형</label>
      <label class="chk"><input type="checkbox" class="exemption" value="자가소비용"> 자가소비용</label>

      <label for="apply_date">개발행위허가 신청 예정일</label>
      <input id="apply_date" type="date">

      <button type="submit" id="submit-btn">판정표 만들기</button>
    </form>
    <p id="form-msg"></p>

    <p class="sect">지도 레이어</p>
    <label class="chk"><input type="checkbox" id="layer-zoning" checked> 용도지역</label>
    <label class="chk"><input type="checkbox" id="layer-satellite" checked> 위성사진</label>
  </aside>

  <div id="map-wrap">
    <div id="map"></div>
    <div id="map-notice" hidden></div>
    <div id="legend"></div>
  </div>

  <aside id="panel-right" hidden>
    <div id="result-head"></div>
    <div id="tab-bar">
      <button type="button" data-tab="진단" aria-selected="true">진단</button>
      <button type="button" data-tab="필지" aria-selected="false">필지</button>
      <button type="button" data-tab="법령" aria-selected="false">법령</button>
      <button type="button" data-tab="이격" aria-selected="false">이격</button>
    </div>
    <div class="tabpane on" id="tab-진단"></div>
    <div class="tabpane" id="tab-필지"></div>
    <div class="tabpane" id="tab-법령"></div>
    <div class="tabpane" id="tab-이격"></div>
  </aside>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/map_utils.js"></script>
<script>
  const { shouldLoadZoning, toleranceForZoom, categoryColor, ZONE_CATEGORIES } = window.MapUtils;

  // 전남 중심. 처음에는 줌 9로 전체를 보여준다(용도지역은 아직 안 칠해진다).
  const JEONNAM_CENTER = [34.86, 126.99];
  const MAX_ZONING_ROWS = 3000;

  let cfg = { vworld_map_key: "", supabase_url: "", supabase_key: "" };
  let leafletMap = null, tileLayer = null, zoningLayer = null;
  let markerLayer = null, zoneOutlineLayer = null;
  let zoningRequestId = 0;

  const noticeEl = document.getElementById("map-notice");
  function notice(text) {
    if (!text) { noticeEl.hidden = true; return; }
    noticeEl.textContent = text;
    noticeEl.hidden = false;
  }

  leafletMap = L.map("map", { attributionControl: false }).setView(JEONNAM_CENTER, 9);
  L.control.attribution({ prefix: false }).addTo(leafletMap)
    .addAttribution("© VWorld, 국토교통부 · 용도지역: 토지이음");

  fetch("/api/site_judge?config=1")
    .then(function (r) { return r.json(); })
    .then(function (c) {
      cfg = c;
      if (cfg.vworld_map_key) {
        tileLayer = L.tileLayer(
          "https://api.vworld.kr/req/wmts/1.0.0/" + cfg.vworld_map_key + "/Satellite/{z}/{y}/{x}.jpeg",
          { maxZoom: 19, tileSize: 256 }
        ).addTo(leafletMap);
      }
      loadZoning();
    })
    .catch(function () { notice("지도 설정을 불러오지 못했습니다. 새로고침해 주세요."); });

  // 브이월드 지오코더 REST API는 서버(Vercel)에서 부르면 막히고, 브라우저에서 fetch로
  // 직접 부르면 CORS로 막힌다(HANDOVER.md §5-4/§5-5) - 그런데 JSONP(스크립트 태그로 불러오는
  // 방식)는 CORS 대상이 아니라서 정상 동작한다. eum.go.kr이 사용자 브라우저에서는 항상 됐던
  // 것과 같은 원리로, 방문자 브라우저에서 직접 좌표를 구해서 그 결과만 서버로 보낸다.
  function geocodeJsonpOnce(address, addrType, timeoutMs) {
    return new Promise(function (resolve) {
      if (!cfg.vworld_map_key) {
        resolve({ok: false, reason: "브이월드 키를 아직 못 받아왔습니다. 잠시 후 다시 시도해주세요."});
        return;
      }
      const cbName = "vw_geocode_cb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
      const script = document.createElement("script");
      let done = false;
      function cleanup() {
        delete window[cbName];
        script.remove();
      }
      window[cbName] = function (data) {
        done = true;
        cleanup();
        const status = data && data.response && data.response.status;
        if (status === "OK") {
          const point = data.response.result.point;
          resolve({
            ok: true,
            lon: parseFloat(point.x),
            lat: parseFloat(point.y),
            refined_addr: data.response.refined.text,
          });
        } else {
          resolve({ok: false, reason: "주소를 찾을 수 없습니다 (" + status + ")"});
        }
      };
      script.onerror = function () {
        if (!done) { resolve({ok: false, reason: "지오코딩 요청 실패"}); cleanup(); }
      };
      setTimeout(function () {
        if (!done) { resolve({ok: false, reason: "지오코딩 응답 시간초과"}); cleanup(); }
      }, timeoutMs || 5000);
      const base = "https://api.vworld.kr/req/address?service=address&request=getcoord&version=2.0" +
        "&crs=epsg:4326&format=json&key=" + cfg.vworld_map_key + "&address=" + encodeURIComponent(address);
      script.src = base + "&type=" + addrType + "&callback=" + cbName;
      document.body.appendChild(script);
    });
  }

  async function geocodeJsonp(address) {
    const road = await geocodeJsonpOnce(address, "road");
    if (road.ok) return road;
    return geocodeJsonpOnce(address, "parcel");
  }

  // 화면 범위의 용도지역을 Supabase에서 직접 받아 칠한다.
  // 여기서 받는 도형은 단순화된 표시용이다 - 판정에는 절대 쓰지 않는다(설계서 §4.4).
  // 줌 12에서 단순화 오차가 55m까지 나므로, 경계 근처는 화면 색과 실제 판정이 다를 수 있다.
  async function loadZoning() {
    if (!document.getElementById("layer-zoning").checked) {
      if (zoningLayer) { leafletMap.removeLayer(zoningLayer); zoningLayer = null; }
      notice("");
      return;
    }
    const zoom = leafletMap.getZoom();
    if (!shouldLoadZoning(zoom)) {
      if (zoningLayer) { leafletMap.removeLayer(zoningLayer); zoningLayer = null; }
      notice("확대하면 용도지역이 표시됩니다");
      return;
    }
    if (!cfg.supabase_url || !cfg.supabase_key) {
      notice("용도지역 레이어를 불러오지 못했습니다 (설정 없음). 판정은 그대로 됩니다.");
      return;
    }

    const myId = ++zoningRequestId;   // 지도를 빠르게 움직이면 늦게 온 응답이 최신을 덮어쓴다
    const b = leafletMap.getBounds();
    try {
      const res = await fetch(cfg.supabase_url.replace(/\/$/, "") + "/rest/v1/rpc/zoning_in_bbox", {
        method: "POST",
        headers: {
          "apikey": cfg.supabase_key,
          "Authorization": "Bearer " + cfg.supabase_key,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          min_lon: b.getWest(), min_lat: b.getSouth(),
          max_lon: b.getEast(), max_lat: b.getNorth(),
          tolerance: toleranceForZoom(zoom),
          max_rows: MAX_ZONING_ROWS,
        }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const rows = await res.json();
      if (myId !== zoningRequestId) return;   // 더 새로운 요청이 진행 중

      if (zoningLayer) leafletMap.removeLayer(zoningLayer);
      zoningLayer = L.layerGroup(rows.map(function (row) {
        const color = categoryColor(row.zone_category);
        return L.geoJSON(JSON.parse(row.geojson), {
          style: { color: color, weight: 1, fillColor: color, fillOpacity: 0.35 },
        }).bindTooltip(row.zone_name, { sticky: true });
      })).addTo(leafletMap);

      // 3,000건에서 잘렸을 수 있다. 조용히 자르면 사용자가 빈 곳을 보고
      // "용도지역이 없는 땅"으로 오해한다.
      notice(rows.length >= MAX_ZONING_ROWS
        ? "이 범위에는 표시할 수 있는 것보다 많은 구역이 있습니다 — 확대하세요" : "");
    } catch (e) {
      if (myId !== zoningRequestId) return;
      // 레이어 실패가 판정을 막지 않는다. 둘은 다른 경로다.
      notice("용도지역 레이어를 불러오지 못했습니다 (" + e.message + "). 판정은 그대로 됩니다.");
    }
  }

  leafletMap.on("moveend", loadZoning);
  document.getElementById("layer-zoning").addEventListener("change", loadZoning);
  document.getElementById("layer-satellite").addEventListener("change", function () {
    if (!tileLayer) return;
    if (this.checked) tileLayer.addTo(leafletMap); else leafletMap.removeLayer(tileLayer);
  });

  function renderLegend() {
    document.getElementById("legend").innerHTML =
      "<b>용도지역</b>" + ZONE_CATEGORIES.map(function (c) {
        return '<div class="item"><span class="sw" style="background:' + categoryColor(c) +
               '"></span>' + c + "</div>";
      }).join("");
  }
  renderLegend();

  const panelRight = document.getElementById("panel-right");
  const msgEl = document.getElementById("form-msg");
  let lastData = null;

  document.getElementById("tab-bar").addEventListener("click", function (e) {
    const btn = e.target.closest("button[data-tab]");
    if (btn) switchTab(btn.dataset.tab);
  });

  function switchTab(name) {
    document.querySelectorAll("#tab-bar button").forEach(function (b) {
      b.setAttribute("aria-selected", String(b.dataset.tab === name));
    });
    document.querySelectorAll(".tabpane").forEach(function (p) {
      p.classList.toggle("on", p.id === "tab-" + name);
    });
    if (name === "법령" && typeof loadLawTab === "function") loadLawTab();
  }

  // 지도 클릭 = 그 좌표로 판정. 주소를 몰라도 검토할 수 있어야 한다.
  leafletMap.on("click", function (e) {
    judge(e.latlng.lng, e.latlng.lat, "지도에서 선택한 지점");
  });

  document.getElementById("addr-search").addEventListener("submit", async function (e) {
    e.preventDefault();
    const address = document.getElementById("address").value.trim();
    if (!address) return;
    msgEl.textContent = "좌표 변환 중...";
    const geo = await geocodeJsonp(address);
    if (!geo.ok) { msgEl.textContent = "주소 조회 실패: " + geo.reason; return; }
    leafletMap.setView([geo.lat, geo.lon], 17);
    judge(geo.lon, geo.lat, geo.refined_addr || address);
  });

  document.getElementById("judge-form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!markerLayer) { msgEl.textContent = "먼저 주소를 검색하거나 지도를 클릭하세요."; return; }
    const ll = markerLayer.getLatLng();
    judge(ll.lng, ll.lat, document.getElementById("address").value.trim() || "지도에서 선택한 지점");
  });

  async function judge(lon, lat, label) {
    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    msgEl.textContent = "용도지역 조회 → 규제 매칭 → 판정 중...";

    if (markerLayer) leafletMap.removeLayer(markerLayer);
    markerLayer = L.marker([lat, lon]).addTo(leafletMap);

    const params = new URLSearchParams({
      address: label === "지도에서 선택한 지점" ? "" : label,
      refined_addr: label,
      project_type: document.getElementById("project_type").value,
      capacity_kw: document.getElementById("capacity_kw").value || "0",
      lon: lon, lat: lat,
      exemptions: Array.from(document.querySelectorAll(".exemption:checked"))
        .map(function (el) { return el.value; }).join(","),
      apply_date: document.getElementById("apply_date").value,
    });

    try {
      const res = await fetch("/api/site_judge?" + params.toString());
      const data = await res.json();
      if (!res.ok || data.error) { msgEl.textContent = "오류: " + (data.error || res.status); return; }
      lastData = data;
      renderResult(data, label);
      msgEl.textContent = "";
    } catch (err) {
      msgEl.textContent = "요청 실패: " + err.message;
    } finally {
      btn.disabled = false;
    }
  }

  function renderResult(data, label) {
    panelRight.hidden = false;
    const eum = data.eum || {};
    const zones = eum.zone_national_law || [];
    document.getElementById("result-head").innerHTML =
      escapeHtml(label) + '<span class="zone">' + escapeHtml(zones[0] || "용도지역 미확인") + "</span>";

    // 선택 지점의 용도지역 경계. 이것도 표시용이다.
    if (zoneOutlineLayer) { leafletMap.removeLayer(zoneOutlineLayer); zoneOutlineLayer = null; }
    if (eum.zone_geometry) {
      zoneOutlineLayer = L.geoJSON(eum.zone_geometry, {
        style: { color: "#1b2030", weight: 3, dashArray: "6 4", fill: false },
      }).addTo(leafletMap);
    }

    renderDiagnosis(data);
    renderParcel(data, label);
    renderSetback(data);
    document.getElementById("tab-법령").innerHTML = '<p class="foot">탭을 열면 조문을 불러옵니다.</p>';
    switchTab("진단");
  }

  function renderDiagnosis(data) {
    const el = document.getElementById("tab-진단");
    if (data.note) {
      el.innerHTML = '<div class="note">' + escapeHtml(data.note) + "</div>" +
        '<p class="foot">※ 확실하지 않으면 "비저촉"으로 단정하지 않고 사람 확인을 요구합니다.</p>';
      return;
    }
    if (!data.table || !data.table.length) {
      el.innerHTML = '<p class="foot">걸리는 규제 항목을 찾지 못했습니다 (규칙표 미등록 가능성 — 사람 확인 권장).</p>';
      return;
    }
    el.innerHTML = "<table><thead><tr><th>항목</th><th>판정</th><th>비고</th></tr></thead><tbody>" +
      data.table.map(function (r) {
        return "<tr><td>" + escapeHtml(r["항목"] || "") + "</td>" +
          '<td class="status-' + escapeHtml(r["판정"] || "") + '">' + escapeHtml(r["판정"] || "") + "</td>" +
          "<td>" + escapeHtml(r["비고"] || "") + "</td></tr>";
      }).join("") + "</tbody></table>" +
      '<p class="foot">※ "조건부"/"판정불가"는 사람 검토가 필요합니다. 조문 원문은 법령 탭에 있습니다.</p>';
  }

  function renderParcel(data, label) {
    const eum = data.eum || {}, v = data.vworld || {};
    const rows = [
      ["주소", label],
      ["용도지역", (eum.zone_national_law || []).join(", ") || "-"],
      ["시군구", (eum.sgg_nm || "-") + " (" + (eum.sgg_cd || "-") + ")"],
      ["지목", eum.jimok_code || "미제공"],
      ["면적", eum.area_sqm || "미제공"],
      ["좌표", v.lon ? v.lon.toFixed(6) + ", " + v.lat.toFixed(6) : "-"],
      ["조회 경로", eum.source === "gis" ? "용도지역 DB (GIS)" : "토지이음"],
    ];
    document.getElementById("tab-필지").innerHTML = "<dl>" + rows.map(function (r) {
      return "<div><dt>" + escapeHtml(r[0]) + "</dt><dd>" + escapeHtml(String(r[1])) + "</dd></div>";
    }).join("") + "</dl>" +
      '<p class="foot">지목·면적은 토지이음 조회가 성공한 경우에만 표시됩니다.</p>';
  }

  function renderSetback(data) {
    const row = (data.table || []).find(function (r) {
      return (r["항목"] || "").indexOf("이격") >= 0;
    });
    const el = document.getElementById("tab-이격");
    if (!row) {
      el.innerHTML = '<p class="foot">이격거리 항목이 판정표에 없습니다.</p>';
      return;
    }
    el.innerHTML = "<dl>" +
      '<div><dt>판정</dt><dd class="status-' + escapeHtml(row["판정"] || "") + '">' +
      escapeHtml(row["판정"] || "") + "</dd></div>" +
      "<div><dt>근거</dt><dd>" + escapeHtml(row["근거조문"] || "-") + "</dd></div>" +
      "</dl>" +
      '<p class="foot">' + escapeHtml(row["비고"] || "") + "</p>" +
      (row["출처"] ? '<p class="foot"><a href="' + escapeAttr(row["출처"]) + '" target="_blank">조례 원문</a></p>' : "");
  }

  // 판정표의 '항목'에서 법령명과 조문을 뽑는다. rule_table.csv의 law_name/law_article이
  // 그대로 오지 않으므로, 서버가 준 근거조문 텍스트 앞부분에 있는 법령명·조문 표기를 쓴다.
  const LAW_PATTERN = /([가-힣ㆍ·\s]+(?:법|법률|조례|규칙|시행령|시행규칙))\s*(제\d+조(?:의\s*\d+)?|별표\s*\d+)/;

  async function loadLawTab() {
    const el = document.getElementById("tab-법령");
    if (!lastData || !lastData.table || !lastData.table.length) {
      el.innerHTML = '<p class="foot">판정 결과가 없습니다.</p>';
      return;
    }
    const seen = new Set();
    const targets = [];
    lastData.table.forEach(function (r) {
      const m = LAW_PATTERN.exec(r["근거조문"] || "");
      if (!m) return;
      const key = m[1].trim() + " " + m[2].replace(/\s/g, "");
      if (seen.has(key)) return;
      seen.add(key);
      targets.push({ law_name: m[1].trim(), law_article: m[2].replace(/\s/g, "") });
    });

    if (!targets.length) {
      el.innerHTML = '<p class="foot">근거 조문을 식별하지 못했습니다. 진단 탭의 근거조문을 확인하세요.</p>';
      return;
    }

    el.innerHTML = '<p class="foot">조문을 불러오는 중...</p>';
    const parts = await Promise.all(targets.map(async function (t) {
      try {
        const res = await fetch("/api/site_judge/law?law_name=" + encodeURIComponent(t.law_name) +
                                "&law_article=" + encodeURIComponent(t.law_article));
        const d = await res.json();
        if (d.status !== "ok") {
          return '<div class="lawitem"><h4>' + escapeHtml(t.law_name + " " + t.law_article) +
                 '</h4><pre>조회 실패: ' + escapeHtml(d.reason || "") + "</pre></div>";
        }
        return '<div class="lawitem"><h4>' + escapeHtml(t.law_name + " " + t.law_article) +
               " " + escapeHtml(d.article_title || "") + "</h4>" +
               "<pre>" + escapeHtml(d.text || "") + "</pre>" +
               '<p class="foot">시행 ' + escapeHtml(d.effective_date || "-") +
               (d.source_url ? ' · <a href="' + escapeAttr(d.source_url) + '" target="_blank">원문</a>' : "") +
               "</p></div>";
      } catch (e) {
        return '<div class="lawitem"><h4>' + escapeHtml(t.law_name + " " + t.law_article) +
               '</h4><pre>요청 실패: ' + escapeHtml(e.message) + "</pre></div>";
      }
    }));
    el.innerHTML = parts.join("") +
      '<p class="foot">법령 원문은 국가법령정보센터에서 실시간으로 가져옵니다.</p>';
  }

  function escapeHtml(text) {
    return String(text == null ? "" : text).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }
  function escapeAttr(text) { return String(text == null ? "" : text).replace(/"/g, "&quot;"); }
</script>
</body>
</html>
