<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사업 분석자동화</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --ink:#1b2030; --muted:#5b6472; --line:#e6e8ee; --accent:#3f5bd9;
         --left:280px; --right:340px; --top:52px; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;line-height:1.55}
  .topbar{height:var(--top);display:flex;align-items:center;gap:14px;padding:0 16px;
          background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:1000}
  .topbar h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
  .topbar .coverage{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
  #addr-search{flex:1;max-width:380px;display:flex;gap:6px}
  #addr-search input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font:inherit}
  #addr-search button{padding:7px 14px;border:0;border-radius:7px;background:var(--accent);color:#fff;
                      font:inherit;font-weight:600;cursor:pointer}
  .shell{display:flex;height:calc(100% - var(--top));min-height:0}
  #panel-left{width:var(--left);flex:none;background:var(--card);border-right:1px solid var(--line);
              overflow-y:auto;padding:14px}
  #map-wrap{flex:1;position:relative;min-width:0}
  #map{position:absolute;inset:0;background:#e9ebef}
  #panel-right{width:var(--right);flex:none;background:var(--card);border-left:1px solid var(--line);
               overflow-y:auto;display:flex;flex-direction:column}
  #panel-right[hidden]{display:none}
  .sect{font-size:11px;color:var(--muted);margin:14px 0 7px;letter-spacing:.02em}
  .sect:first-child{margin-top:0}
  label{display:block;font-size:13px;color:var(--muted);margin:9px 0 4px}
  input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;background:#fff}
  .row{display:flex;gap:8px}
  .row>div{flex:1}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);margin:5px 0}
  .chk input{width:auto;margin:0}
  #judge-form button{margin-top:14px;width:100%;padding:10px;border:0;border-radius:7px;
                     background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  #judge-form button:disabled{opacity:.5;cursor:default}
  #form-msg{margin-top:9px;font-size:12.5px;color:var(--muted);white-space:pre-wrap;min-height:18px}
  #legend{position:absolute;left:10px;bottom:10px;z-index:500;background:rgba(255,255,255,.94);
          border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px;max-width:190px}
  #legend b{display:block;margin-bottom:5px;font-size:11px;color:var(--muted);font-weight:600}
  #legend .item{display:flex;align-items:center;gap:6px;margin:2px 0}
  #legend .sw{width:11px;height:11px;border-radius:2px;flex:none}
  #map-notice{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:500;
              background:rgba(27,32,48,.88);color:#fff;border-radius:7px;padding:7px 13px;font-size:12.5px;
              max-width:80%;text-align:center}
  #map-notice[hidden]{display:none}
  #tab-bar{display:flex;border-bottom:1px solid var(--line);flex:none}
  #tab-bar button{flex:1;padding:10px 4px;border:0;background:none;font:inherit;font-size:12.5px;
                  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  #tab-bar button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
  .tabpane{padding:13px;display:none}
  .tabpane.on{display:block}
  #result-head{padding:13px 13px 0;font-size:12.5px;color:var(--muted)}
  #result-head .zone{display:block;font-size:15px;color:var(--ink);font-weight:700;margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{border-bottom:1px solid var(--line);text-align:left;padding:7px 5px;vertical-align:top}
  th{color:var(--muted);font-weight:600}
  dl{margin:0;font-size:12.5px}
  dl div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
  dt{color:var(--muted)}
  dd{margin:0;text-align:right}
  .status-저촉{color:#c0392b;font-weight:700}
  .status-비저촉{color:#1e8449;font-weight:700}
  .status-조건부,.status-판정불가{color:#b9770e;font-weight:700}
  .note{background:#fef4ec;border:1px solid #e2a06a;border-radius:8px;padding:11px 13px;font-size:13px}
  .foot{margin-top:8px;font-size:11.5px;color:var(--muted)}
  .lawitem{border-bottom:1px solid var(--line);padding:9px 0}
  .lawitem h4{margin:0 0 4px;font-size:13px}
  .lawitem pre{margin:0;white-space:pre-wrap;font:inherit;font-size:12px;color:var(--muted)}
  a{color:var(--accent)}
  .leaflet-container{font-family:inherit}
  @media (max-width:768px){
    .shell{flex-direction:column;height:auto}
    #panel-left,#panel-right{width:auto;border:0;border-top:1px solid var(--line)}
    #map-wrap{height:56vh;flex:none;order:-1}
    .topbar{flex-wrap:wrap;height:auto;padding:8px 12px;gap:8px}
    .topbar .coverage{display:none}
    #addr-search{max-width:none;width:100%}
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>사업 분석자동화</h1>
  <form id="addr-search">
    <input id="address" placeholder="주소 검색 (예: 목포시 옥암동 1)" autocomplete="off">
    <button type="submit">검색</button>
  </form>
  <span class="coverage">전남 22개 시군</span>
</div>

<div class="shell">

  <aside id="panel-left">
    <form id="judge-form">
      <p class="sect">사업 조건</p>
      <div class="row">
        <div>
          <label for="project_type">사업 종류</label>
          <select id="project_type">
            <option value="태양광">태양광</option>
            <option value="육상풍력">육상풍력</option>
            <option value="해상풍력">해상풍력</option>
          </select>
        </div>
        <div>
          <label for="capacity_kw">용량(kW)</label>
          <input id="capacity_kw" type="number" min="0" step="0.1" placeholder="990">
        </div>
      </div>

      <p class="sect">이격거리 적용 배제 (법 제27조의3제3항)</p>
      <label class="chk"><input type="checkbox" class="exemption" value="주민참여형"> 주민참여형</label>
      <label class="chk"><input type="checkbox" class="exemption" value="지붕형"> 지붕형</label>
      <label class="chk"><input type="checkbox" class="exemption" value="자가소비용"> 자가소비용</label>

      <label for="apply_date">개발행위허가 신청 예정일</label>
      <input id="apply_date" type="date">

      <button type="submit" id="submit-btn">판정표 만들기</button>
    </form>
    <p id="form-msg"></p>

    <p class="sect">지도 레이어</p>
    <label class="chk"><input type="checkbox" id="layer-zoning" checked> 용도지역</label>
    <label class="chk"><input type="checkbox" id="layer-satellite" checked> 위성사진</label>
  </aside>

  <div id="map-wrap">
    <div id="map"></div>
    <div id="map-notice" hidden></div>
    <div id="legend"></div>
  </div>

  <aside id="panel-right" hidden>
    <div id="result-head"></div>
    <div id="tab-bar">
      <button type="button" data-tab="진단" aria-selected="true">진단</button>
      <button type="button" data-tab="필지" aria-selected="false">필지</button>
      <button type="button" data-tab="법령" aria-selected="false">법령</button>
      <button type="button" data-tab="이격" aria-selected="false">이격</button>
    </div>
    <div class="tabpane on" id="tab-진단"></div>
    <div class="tabpane" id="tab-필지"></div>
    <div class="tabpane" id="tab-법령"></div>
    <div class="tabpane" id="tab-이격"></div>
  </aside>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/map_utils.js"></script>
<script>
  let cfg = { vworld_map_key: "", supabase_url: "", supabase_key: "" };

  // 페이지 로드 시점에 지도/지오코딩용 브이월드 키를 미리 받아둔다.
  fetch("/api/site_judge?config=1")
    .then(function (res) { return res.json(); })
    .then(function (data) { cfg.vworld_map_key = (data && data.vworld_map_key) || ""; })
    .catch(function () {});

  // 브이월드 지오코더 REST API는 서버(Vercel)에서 부르면 막히고, 브라우저에서 fetch로
  // 직접 부르면 CORS로 막힌다(HANDOVER.md §5-4/§5-5) - 그런데 JSONP(스크립트 태그로 불러오는
  // 방식)는 CORS 대상이 아니라서 정상 동작한다. eum.go.kr이 사용자 브라우저에서는 항상 됐던
  // 것과 같은 원리로, 방문자 브라우저에서 직접 좌표를 구해서 그 결과만 서버로 보낸다.
  function geocodeJsonpOnce(address, addrType, timeoutMs) {
    return new Promise(function (resolve) {
      if (!cfg.vworld_map_key) {
        resolve({ok: false, reason: "브이월드 키를 아직 못 받아왔습니다. 잠시 후 다시 시도해주세요."});
        return;
      }
      const cbName = "vw_geocode_cb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
      const script = document.createElement("script");
      let done = false;
      function cleanup() {
        delete window[cbName];
        script.remove();
      }
      window[cbName] = function (data) {
        done = true;
        cleanup();
        const status = data && data.response && data.response.status;
        if (status === "OK") {
          const point = data.response.result.point;
          resolve({
            ok: true,
            lon: parseFloat(point.x),
            lat: parseFloat(point.y),
            refined_addr: data.response.refined.text,
          });
        } else {
          resolve({ok: false, reason: "주소를 찾을 수 없습니다 (" + status + ")"});
        }
      };
      script.onerror = function () {
        if (!done) { resolve({ok: false, reason: "지오코딩 요청 실패"}); cleanup(); }
      };
      setTimeout(function () {
        if (!done) { resolve({ok: false, reason: "지오코딩 응답 시간초과"}); cleanup(); }
      }, timeoutMs || 5000);
      const base = "https://api.vworld.kr/req/address?service=address&request=getcoord&version=2.0" +
        "&crs=epsg:4326&format=json&key=" + cfg.vworld_map_key + "&address=" + encodeURIComponent(address);
      script.src = base + "&type=" + addrType + "&callback=" + cbName;
      document.body.appendChild(script);
    });
  }

  async function geocodeJsonp(address) {
    const road = await geocodeJsonpOnce(address, "road");
    if (road.ok) return road;
    return geocodeJsonpOnce(address, "parcel");
  }
</script>
</body>
</html>
